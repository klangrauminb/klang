[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# HTTPS Redirect
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# ⚠️ WICHTIG: Reihenfolge der Header-Regeln!
# Netlify wendet Header in Definitionsreihenfolge an.
# Die LETZTE passende Regel gewinnt bei identischen Headern.
# Daher: ALLGEMEINE Regeln zuerst, SPEZIFISCHE danach!

# ============================================================
# 1) Globale Header (gelten für ALLE Pfade)
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' api.web3forms.com;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ============================================================
# 2) Admin-Bereich CSP Override (muss NACH /* kommen!)
#    Überschreibt den strikten CSP für /admin/ damit Decap CMS
#    und Netlify Identity externe Scripts laden dürfen.
# ============================================================
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https: blob:; font-src 'self' https://unpkg.com; connect-src 'self' https://api.netlify.com https://api.github.com https://unpkg.com; frame-ancestors 'none'; base-uri 'self';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  publish = "dist"
